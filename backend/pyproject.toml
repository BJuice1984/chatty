[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chatty-backend"
version = "0.1.0"
description = "Internal-network backend foundation for Chatty"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "anyio>=4.4,<4.10",
    "boto3>=1.35,<2",
    "fastapi>=0.115,<0.120",
    "httpx>=0.28,<0.29",
    "openpyxl>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "PyJWT>=2.10,<3",
    "pwdlib[argon2]>=0.2,<1",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn[standard]>=0.34,<0.36",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
namespaces = true
