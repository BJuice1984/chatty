services:
  api:
    build:
      context: ./backend
    environment:
      CHATTY_ENVIRONMENT: ${CHATTY_ENVIRONMENT:-development}
      CHATTY_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-chatty}:${POSTGRES_PASSWORD:-}@db:5432/${POSTGRES_DB:-chatty}
      CHATTY_JWT_SECRET: ${CHATTY_JWT_SECRET:-}
      CHATTY_ALLOWED_ORIGINS: ${CHATTY_ALLOWED_ORIGINS:-["http://localhost:3000"]}
      CHATTY_COOKIE_SECURE: ${CHATTY_COOKIE_SECURE:-false}
      CHATTY_SEED_ADMIN_EMAIL: ${CHATTY_SEED_ADMIN_EMAIL:-}
      CHATTY_SEED_ADMIN_PASSWORD: ${CHATTY_SEED_ADMIN_PASSWORD:-}
    command: >-
      sh -c "alembic upgrade head && python -m app.seed &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${API_BIND_IP:-127.0.0.1}:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - chatty-internal

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatty}
      POSTGRES_USER: ${POSTGRES_USER:-chatty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - chatty-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chatty} -d ${POSTGRES_DB:-chatty}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - chatty-internal

  object-storage:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: ${RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS:-*}
      RUSTFS_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY must be set}
      RUSTFS_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY must be set}
      RUSTFS_OBS_LOGGER_LEVEL: warn
    volumes:
      - chatty-object-storage:/data
    depends_on:
      object-storage-volume-init:
        condition: service_completed_successfully
    ports:
      - "${OBJECT_STORAGE_BIND_IP:-127.0.0.1}:9000:9000"
      - "${OBJECT_STORAGE_CONSOLE_BIND_IP:-127.0.0.1}:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - chatty-internal

  object-storage-volume-init:
    image: busybox:1.36
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    volumes:
      - chatty-object-storage:/data
    networks:
      - chatty-internal

volumes:
  chatty-postgres:
  chatty-object-storage:

networks:
  chatty-internal:
    driver: bridge
